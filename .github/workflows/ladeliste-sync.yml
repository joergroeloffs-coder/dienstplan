name: Ladeliste Sync

# Erzeugt die mobile Ladeliste-Seite (docs/<SLUG>/ladeliste.html) aus der
# aktuellen state.json + den Live-Ladelisten auf faehre2.de.
#
# GitHubs eigener "schedule"-Trigger (unten) wird zwar angemeldet, feuert
# aber auf diesem Repo nachweislich nicht (0 Laeufe ueber mehrere Tage -
# bekanntes Problem bei 5-Minuten-Crons). Deshalb laeuft intern eine
# Schleife: einmal pro Stunde angestossen (aktuell per workflow_dispatch),
# aktualisiert dieser einzelne Lauf die Ladeliste anschliessend 11x im
# 5-Minuten-Abstand selbststaendig weiter - "im Hintergrund" heisst hier:
# kein weiterer Anstoss noetig, bis der naechste Stundenlauf beginnt.
# Nur relevant waehrend der Betriebszeit der Faehren; ausserhalb (naechtens)
# aendert sich eh nichts, die Laeufe committen dann einfach nichts.
# Ueberlappt sich ein Lauf mit einem noch laufenden, wartet er dank
# "concurrency" einfach, statt parallel zu laufen.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "2-59/5 4-20 * * *"

permissions:
  contents: write

concurrency:
  group: ladeliste-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ladeliste aktualisieren (11x im 5-Minuten-Abstand)
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: |
          git config user.name "dienstplan-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 11); do
            echo "=== Durchlauf $i ==="
            python ladeliste_page.py
            git add -A docs
            if git diff --quiet --cached; then
              echo "Durchlauf $i: keine Aenderungen."
            else
              git commit -m "Ladeliste aktualisiert"
              git pull --rebase --autostash
              git push
            fi
            if [ "$i" -lt 11 ]; then
              sleep 300
            fi
          done
