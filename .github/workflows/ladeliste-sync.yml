name: Ladeliste Sync

# War: erzeugte die mobile Ladeliste-Seite (docs/<SLUG>/ladeliste.html)
# per Cronjob aus den Live-Ladelisten auf faehre2.de.
#
# Abgeloest durch die Cloudflare-Worker-Loesung (ladeliste-worker/,
# sites-ladelisten/, PR 14): dort aktualisiert sich die Ladeliste
# zuverlaessig alle 2 Minuten im Hintergrund, ohne dass GitHub Actions
# dafuer angestossen werden muss. Der automatische Schedule-Trigger hier
# ist deshalb deaktiviert; workflow_dispatch bleibt als manueller
# Fallback nutzbar, falls die neue Loesung einmal ausfallen sollte.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ladeliste-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ladeliste aktualisieren (11x im 5-Minuten-Abstand)
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: |
          git config user.name "dienstplan-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 11); do
            echo "=== Durchlauf $i ==="
            python ladeliste_page.py
            git add -A docs
            if git diff --quiet --cached; then
              echo "Durchlauf $i: keine Aenderungen."
            else
              git commit -m "Ladeliste aktualisiert"
              git pull --rebase --autostash
              git push
            fi
            if [ "$i" -lt 11 ]; then
              sleep 300
            fi
          done
