name: Ladeliste Sync

# Erzeugt die mobile Ladeliste-Seite (docs/<SLUG>/ladeliste.html) aus der
# aktuellen state.json + den Live-Ladelisten auf faehre2.de.
#
# Laeuft komplett im Hintergrund ueber GitHub Actions' eigenen "schedule"-
# Trigger, alle 5 Minuten, aber nur waehrend der Betriebszeit der Faehren
# (ca. 06:00-21:00 Uhr deutscher Zeit -> 04:00-20:59 UTC, mit Puffer fuer
# Sommer-/Winterzeit). Ausserhalb dieses Fensters laeuft nichts - kein
# Anstoss mehr von aussen noetig. workflow_dispatch bleibt als manueller
# Fallback. Ueberlappt sich ein Lauf mit einem noch laufenden, wartet er
# dank "concurrency" einfach, statt parallel zu laufen.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "2-59/5 4-20 * * *"

permissions:
  contents: write

concurrency:
  group: ladeliste-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ladeliste aktualisieren
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: |
          git config user.name "dienstplan-bot"
          git config user.email "actions@users.noreply.github.com"
          python ladeliste_page.py
          git add -A docs
          if git diff --quiet --cached; then
            echo "Keine Aenderungen."
          else
            git commit -m "Ladeliste aktualisiert"
            git pull --rebase --autostash
            git push
          fi
