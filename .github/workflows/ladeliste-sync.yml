name: Ladeliste Sync

# Erzeugt die mobile Ladeliste-Seite (docs/<SLUG>/ladeliste.html) aus der
# aktuellen state.json + den Live-Ladelisten auf faehre2.de. Alle 5
# Minuten, da GitHub Actions keine kuerzeren Cron-Intervalle zuverlaessig
# unterstuetzt - die Seite selbst laedt sich zusaetzlich per JS mit
# Cache-Busting alle 60s neu (zeigt dann den zuletzt veroeffentlichten
# Stand).
#
# Hinweis: Neucommit der Datei am 17.10.2026, um GitHubs interne
# Scheduler-Registrierung des Cronjobs neu anzustossen (der Cron lief
# ueber 2 Std. seit Erstellung kein einziges Mal automatisch).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ladeliste-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ladeliste-Seite erzeugen
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: python ladeliste_page.py

      - name: Commit and push changes
        run: |
          git config user.name "dienstplan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs
          if git diff --quiet --cached; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "Ladeliste aktualisiert"
          git pull --rebase --autostash
          git push
