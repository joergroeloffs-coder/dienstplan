name: Ladeliste Sync

# Erzeugt die mobile Ladeliste-Seite (docs/<SLUG>/ladeliste.html) aus der
# aktuellen state.json + den Live-Ladelisten auf faehre2.de.
#
# GitHub Actions' eigener "schedule"-Trigger hat sich als unzuverlaessig
# erwiesen (0 automatische Laeufe ueber mehrere Stunden, auch nach
# Neu-Registrierung durch Commit). Stattdessen laeuft dieser Workflow
# nur per workflow_dispatch, wiederholt sich darin aber selbst alle 5
# Minuten (Schleife mit Sleep) fuer ca. 55 Minuten. Eine separate,
# stuendliche Routine (ausserhalb von GitHub Actions) stoesst
# workflow_dispatch an - die Kombination ergibt zuverlaessig alle 5
# Minuten frische Daten, ohne auf GitHubs eigenen Scheduler angewiesen
# zu sein. Ueberlappt sich ein neuer Anstoss mit einem noch laufenden
# Lauf, wartet er dank "concurrency" einfach, statt parallel zu laufen.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ladeliste-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Alle 5 Minuten aktualisieren (ca. 55 Minuten lang)
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: |
          git config user.name "dienstplan-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 11); do
            echo "=== Durchlauf $i/11 ($(date -u +%H:%M:%S) UTC) ==="
            python ladeliste_page.py
            git add -A docs
            if git diff --quiet --cached; then
              echo "Keine Aenderungen."
            else
              git commit -m "Ladeliste aktualisiert"
              git pull --rebase --autostash
              git push
            fi
            if [ "$i" -lt 11 ]; then
              sleep 300
            fi
          done
