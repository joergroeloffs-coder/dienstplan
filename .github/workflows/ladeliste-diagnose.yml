name: Ladeliste Worker Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Datenabruf-Worker direkt testen
        env:
          API_TOKEN: ${{ secrets.WDR_WORKER_TOKEN }}
        run: |
          echo "--- GET /api/ladeliste (Datenabruf-Worker, direkt) ---"
          curl -sS -i --max-time 20 \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://dienstplan-ladeliste.joerg-roeloffs.workers.dev/api/ladeliste" || true
          echo
          echo "--- GET / (Sites-Worker) ---"
          curl -sS -i --max-time 20 \
            "https://dienstplan-ladelisten-sites.joerg-roeloffs.workers.dev/api/ladeliste" || true
