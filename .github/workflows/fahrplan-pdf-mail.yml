name: Fahrplan-PDF markieren und mailen

on:
  schedule:
    # Stuendlich zur Minute 5. Verschickt trotzdem nur bei Erstlauf oder
    # Aenderung des Fahrplan-PDFs (siehe fahrplan_mail_state.json) - die
    # stuendliche Pruefung selbst loest keine Mail aus, wenn sich nichts
    # geaendert hat.
    - cron: "5 * * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fahrplan-pdf-mail
  cancel-in-progress: false

jobs:
  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fahrplan pruefen und ggf. markiert verschicken
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python fahrplan_pdf_mail.py

      - name: Commit and push changes
        run: |
          git config user.name "dienstplan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A fahrplan_mail_state.json
          if git diff --quiet --cached; then
            echo "Keine Aenderungen."
            exit 0
          fi
          git commit -m "Fahrplan-Mail-Status aktualisiert"
          git pull --rebase --autostash
          git push
