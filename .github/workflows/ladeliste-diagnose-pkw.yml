name: Ladeliste Diagnose PKW

on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Frischen Abruf anstossen, dann Kategorien pruefen
        run: |
          pip install requests >/dev/null
          python3 << 'EOF'
          import requests, json, time
          from collections import Counter

          base = "https://dienstplan-ladelisten-sites.joerg-roeloffs.workers.dev"
          rr = requests.post(base + "/api/refresh", headers={"Origin": base}, timeout=60)
          print("refresh HTTP", rr.status_code)
          time.sleep(2)

          r = requests.get(base + "/api/ladeliste", timeout=30)
          print("ladeliste HTTP", r.status_code)
          data = r.json()
          print("configured:", data.get("configured"), "error:", data.get("error"))
          abfahrten = data.get("abfahrten", [])
          print(f"Gesamtzahl Abfahrten im Feed: {len(abfahrten)}")

          keys = Counter((a["schiff"], a["abfahrt"], a["von"], a["nach"]) for a in abfahrten)
          dupes = {k: n for k, n in keys.items() if n > 1}
          print(f"Eindeutige Abfahrten: {len(keys)}  |  Davon mit Duplikat: {len(dupes)}")

          alle_kategorien = Counter()
          for a in abfahrten:
              for k, n in (a.get("kategorien") or {}).items():
                  alle_kategorien[k] += n

          print("--- Alle vorkommenden Kategorien (Summe ueber alle Abfahrten) ---")
          for k, n in alle_kategorien.most_common():
              print(f"  {k}: {n}")

          print("--- Beispiel: erste 3 Abfahrten mit Buchungsdaten ---")
          mit_daten = [a for a in abfahrten if a.get("kategorien")]
          for a in mit_daten[:3]:
              print(a["schiff"], a["abfahrt"], a["von"], "->", a["nach"], "kategorien:", a["kategorien"], "checkedIn:", a.get("checkedIn"))
          EOF
