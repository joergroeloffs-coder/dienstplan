name: Ladeliste Diagnose PKW

on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fahrzeugzeilen in Basis- vs -PKW-Datei vergleichen
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: |
          pip install requests >/dev/null
          python3 << 'EOF'
          import requests, re, os

          auth = (os.environ["WDR_USER"], os.environ["WDR_PASS"])
          BASE = "https://faehre2.de/fileadmin/wdr/Schiffe/Ladeliste"

          # Gleiche Zeilenerkennung wie ladeliste_page.py: TR/TD-Struktur,
          # Fahrzeugzeile = 8 Inhalts-TDs, erste davon eine Buchungsnummer.
          TR_RE = re.compile(r"<TR>(.*?)</TR>", re.S)
          TD_RE = re.compile(r"<TD[^>]*>(.*?)</TD>", re.S)
          TAG_RE = re.compile(r"<[^>]+>")

          def td_text(td_html):
              return TAG_RE.sub("", td_html).replace("&nbsp", "").strip()

          def vehicle_rows(html):
              buchungsnummern = []
              for tr_html in TR_RE.findall(html):
                  tds = [td_text(td) for td in TD_RE.findall(tr_html)]
                  inhalt = tds[0::2]
                  if len(inhalt) >= 8 and inhalt[0].isdigit():
                      buchungsnummern.append(inhalt[0])
              return buchungsnummern

          for abk in ["NA", "UTHLANDE", "NORDFRIES"]:
              r1 = requests.get(f"{BASE}/{abk}.html", auth=auth, timeout=30)
              r2 = requests.get(f"{BASE}/{abk}-PKW.html", auth=auth, timeout=30)
              v1 = vehicle_rows(r1.text)
              v2 = vehicle_rows(r2.text)
              s1, s2 = set(v1), set(v2)
              print(f"=== {abk} ===")
              print(f"  Basis:  {len(v1)} Fahrzeugzeilen, Buchungsnrn: {sorted(s1)}")
              print(f"  -PKW:   {len(v2)} Fahrzeugzeilen, Buchungsnrn: {sorted(s2)}")
              print(f"  Nur in -PKW (fehlt in Basis): {sorted(s2 - s1)}")
              print(f"  Nur in Basis (fehlt in -PKW): {sorted(s1 - s2)}")
          EOF
