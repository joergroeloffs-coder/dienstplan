name: Diagnose Dienstplan Farbe
on:
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pdfplumber requests
      - name: Alle verfügbaren Wochen durchsuchen (mit Fix)
        env:
          WDR_USER: ${{ secrets.WDR_USER }}
          WDR_PASS: ${{ secrets.WDR_PASS }}
        run: |
          python3 - <<'PY'
          import os
          from io import BytesIO
          import pdfplumber, requests
          import dienstplan_cloud_sync as ds

          session = requests.Session()
          session.auth = (os.environ["WDR_USER"], os.environ["WDR_PASS"])
          session.headers["User-Agent"] = "dienstplan-diagnose/1.0"

          index = ds.fetch_index(session)
          names = ["Roeloffs", "Schumacher", "Helms", "Gleike"]

          print("=== Alle Treffer (farbe gesetzt oder nicht) ===")
          for (jahr, kw), (revision, href, name, mtime) in sorted(index.items()):
              resp = session.get(f"{ds.BASE_URL}/{href}", timeout=30)
              if resp.status_code != 200:
                  continue
              with pdfplumber.open(BytesIO(resp.content)) as pdf:
                  for target in names:
                      hits = ds.find_status_for_name(pdf, target)
                      for h in hits:
                          category, rank, name_cell, links, farbe = h
                          print(f"{jahr}/{kw} ({name}): {name_cell} [{category}] farbe={farbe}")
          print("fertig")
          PY
