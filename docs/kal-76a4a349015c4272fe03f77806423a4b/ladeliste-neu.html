<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ladelisten – alle Schiffe</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#172324;background:#f5f7f7}
*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #cad1d1;padding:14px 18px;position:sticky;top:0;z-index:2}
h1{font-size:22px;margin:0}small{color:#4e6162}.wrap{max-width:850px;margin:auto;padding:14px;display:grid;gap:10px}
article{border:1px solid #d3dada;border-left:6px solid #777;background:white;border-radius:9px;padding:13px 15px}
article.Norderaue{border-left-color:#777}article.Nordfriesland{border-left-color:#bd9b32}article.Uthlande{border-left-color:#bc5960}article.Schleswig-Holstein{border-left-color:#517fb2}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between}.ship{font-weight:700}.time{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}.route{margin:4px 0 12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.stat{background:#f2f4f4;padding:8px 4px;border-radius:5px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px}
details{margin-top:11px}summary{cursor:pointer;font-weight:600}.special{display:grid;grid-template-columns:1fr auto;border-top:1px solid #ddd;padding:5px 0}
#status{font-size:13px;margin-top:4px}.warn{color:#9b271e;font-weight:700}
#now{position:fixed;right:12px;bottom:12px;border:0;border-radius:8px;background:#006e64;color:white;padding:13px 17px;font-weight:700}
@media(max-width:380px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><h1>Ladelisten · Alle Schiffe</h1><div id="status">Abrufdienst noch nicht eingerichtet</div></header>
<div class="wrap" id="list"><p>Die Anzeige ist vorbereitet. Für aktuelle Daten muss die Worker-Adresse eingerichtet werden.</p></div>
<button id="now" type="button">Nächste Abfahrt</button>
<script>
// Nach Bereitstellung die veröffentlichte Worker-Adresse eintragen:
const API_URL="REPLACE_WITH_WORKER_URL/api/ladeliste";
const list=document.getElementById("list"),status=document.getElementById("status");
const localDate=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const localTime=()=>new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date());
const el=(name,cls,content)=>{let x=document.createElement(name);if(cls)x.className=cls;if(content!==undefined)x.textContent=content;return x};
const show=x=>x===null||x===undefined?"–":String(x);
let first=true, lastData=null, connectionFailed=false;
function render(data){
  list.replaceChildren();
  const items=data.abfahrten||[];
  let next=null;
  const now=localTime();
  for(const f of items){
    const a=el("article",f.schiff.replaceAll(" ","-"));a.dataset.time=f.abfahrt;
    a.append(el("div","top",""));
    const top=a.firstChild;top.append(el("div","ship",f.schiff),el("div","time",f.abfahrt));
    a.append(el("div","route",f.von+" → "+f.nach));
    if(f.hinweis)a.append(el("p","",f.hinweis));
    const stats=el("div","stats");
    for(const [n,v] of [["PKW",f.pkw],["Motorräder",f.motorraeder],["Transporter",f.transporter],["Lademeter",f.lademeter===null?null:f.lademeter+" m"]]){
      const cell=el("div","stat");cell.append(el("b","",show(v)),el("span","",n));stats.append(cell);
    }
    a.append(stats);
    if(f.sonderfahrzeuge?.length){
      const d=el("details");d.open=true;d.append(el("summary","",f.sonderfahrzeuge.length+" Sonderfahrzeuge"));
      for(const s of f.sonderfahrzeuge){const row=el("div","special");row.append(el("span","",s.art),el("span","",s.laenge_m===null?"–":s.laenge_m+" m"));d.append(row)}a.append(d);
    }
    list.append(a);
    if(next===null&&f.abfahrt>=now)next=a;
  }
  if(!items.length)list.append(el("p","","Keine Abfahrten vorhanden."));
  lastData=data;
  connectionFailed=false;
  updateStatus();
  window.nextDeparture=next;
  if(first&&next){next.scrollIntoView({block:"start"});first=false}
}
function updateStatus(){
  if(connectionFailed){status.textContent="ABRUF FEHLGESCHLAGEN – Anzeige möglicherweise veraltet";status.className="warn";return;}
  if(!lastData)return;
  const data=lastData;
  const updated=new Date(data.updatedAt);
  const t=updated.toLocaleString("de-DE",{timeZone:"Europe/Berlin",dateStyle:"short",timeStyle:"short"});
  const stale=data.status!=="aktuell"||data.datum!==localDate()||Date.now()-updated.getTime()>300000;
  status.textContent=(data.health?.ok===false?"ABRUFFEHLER – letzter erfolgreicher Stand: ":stale?"VERALTETE DATEN – ":"")+"Letzter erfolgreicher Abruf: "+t+" Uhr";
  status.className=stale?"warn":"";
}
async function reload(){
  if(API_URL.includes("REPLACE_WITH_"))return;
  try{
    const res=await fetch(API_URL+"?t="+Date.now(),{cache:"no-store",signal:AbortSignal.timeout(20000)});
    if(!res.ok)throw Error("HTTP "+res.status);
    render(await res.json());
  }catch(e){connectionFailed=true;status.textContent="ABRUF FEHLGESCHLAGEN – Anzeige möglicherweise veraltet";status.className="warn"}
}
document.getElementById("now").onclick=()=>window.nextDeparture?.scrollIntoView({behavior:"smooth",block:"start"});
reload();setInterval(reload,60000);setInterval(updateStatus,10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)reload()});
</script></body></html>
